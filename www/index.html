<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>EjarRent</title>
<meta name="description" content="تطبيق EjarRent لإدارة تأجير الشاليهات والمزارع والسيارات والشقق، مع تقويم حجوزات وإدارة إيرادات ومصاريف.">
<meta name="theme-color" content="#14171e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700;900&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12151c;
    --surface:#1b202b;
    --surface-2:#242a37;
    --surface-3:#2c3342;
    --line:#333c4d;
    --cream:#f4f0e6;
    --cream-dim:#c9c3b3;
    --gold:#d4af37;
    --gold-deep:#b8862f;
    --gold-soft:#e8cd7a;
    --green:#2fa370;
    --red:#d1544a;
    --orange:#e0912f;
    --blue:#3f7cb0;
    --radius:18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="light"]{
    --ink:#f7f4ee;
    --surface:#ffffff;
    --surface-2:#f0ede4;
    --surface-3:#e6e2d6;
    --line:#ddd7c8;
    --cream:#0e0c08;
    --cream-dim:#454031;
    --gold:#b8862f;
    --gold-deep:#96691f;
    --gold-soft:#8a6620;
    --green:#1f8a5c;
    --red:#c23f36;
    --orange:#c47418;
    --blue:#2f5f8f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  html,body{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  input,textarea,[contenteditable="true"],.selectable{-webkit-user-select:text; user-select:text;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--ink);
    color:var(--cream);
    min-height:100vh;
    min-height:100dvh;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3,h4{font-family:'Cairo',sans-serif; margin:0;}
  .brand-font{font-family:'Aref Ruqaa', serif;}

  /* ---------- App shell (fills the real device screen — no decorative phone frame) ---------- */
  .phone{
    width:100%;
    height:100vh;
    height:100dvh;
    background:var(--ink);
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }

  .appbar{
    padding:calc(18px + env(safe-area-inset-top)) 18px 12px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(180deg, #171b24, rgba(23,27,36,0));
    flex-shrink:0;
  }
  .appbar h2{font-size:19px; color:var(--cream); flex:1;}
  .appbar .sub{font-size:12px; color:var(--cream-dim); font-weight:500;}
  .icon-btn{
    width:38px;height:38px;border-radius:12px; background:var(--surface-2);
    display:flex;align-items:center;justify-content:center; border:1px solid var(--line);
    flex-shrink:0; cursor:pointer;
  }
  .icon-btn:active{background:var(--surface-3);}
  .icon-btn svg{width:19px;height:19px;}

  .screen{
    flex:1; overflow-y:auto; overflow-x:hidden;
    padding: 4px 18px 100px;
    -webkit-overflow-scrolling:touch;
  }
  .screen::-webkit-scrollbar{display:none;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; background:rgba(23,27,36,.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:10px 6px calc(14px + var(--safe-b));
    z-index:500;
  }
  .navitem{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--cream-dim); font-size:10.5px; font-weight:700; cursor:pointer;
  }
  .navitem svg{width:21px;height:21px; opacity:.75;}
  .navitem.active{color:var(--gold-soft);}
  .navitem.active svg{opacity:1;}

  /* ---------- Home ---------- */
  .hero{
    padding:22px 2px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;
  }
  .hero .wordmark{
    font-family:'Cairo','Segoe UI',Arial,sans-serif; font-weight:800; font-size:44px; line-height:1.3; letter-spacing:0;
    background:linear-gradient(160deg,#f3dfa0,#d4af37 55%,#b8862f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    padding-bottom:6px;
  }
  .hero .tag{font-size:12.5px; color:var(--cream-dim); font-weight:600; letter-spacing:.3px;}

  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px;}
  .cat-card{
    background:linear-gradient(160deg,var(--surface-2),var(--surface));
    border:1px solid var(--line); border-radius:20px; padding:18px 14px;
    display:flex; flex-direction:column; gap:14px; cursor:pointer;
    position:relative; overflow:hidden; min-height:132px;
    transition:transform .15s ease;
  }
  .cat-card:active{transform:scale(.97);}
  .cat-card .glow{
    position:absolute; inset:-40% -40% auto auto; width:140px;height:140px;
    background:radial-gradient(circle, rgba(212,175,55,.16), transparent 70%);
  }
  .cat-card .icon-wrap{
    width:50px;height:50px;border-radius:14px;
    background:linear-gradient(145deg,#3a3222,#211d14);
    border:1px solid #4a3f24;
    display:flex;align-items:center;justify-content:center;
  }
  .cat-card .icon-wrap svg{width:27px;height:27px;}
  .cat-card .name{font-family:'Cairo'; font-weight:700; font-size:15.5px;}
  .cat-card .count{font-size:11.5px; color:var(--cream-dim);}

  .section-title{font-family:'Cairo'; font-weight:700; font-size:14.5px; color:var(--cream); margin:22px 0 10px;}

  .quick-row{display:flex; gap:10px;}
  .quick-btn{
    flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
    padding:12px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
  }
  .quick-btn svg{width:20px;height:20px;}
  .quick-btn span{font-size:11px; font-weight:700;}

  /* ---------- Search bar ---------- */
  .search-bar{
    display:flex; align-items:center; gap:8px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin:8px 0 14px;
  }
  .search-bar svg{width:17px;height:17px; opacity:.6; flex-shrink:0;}
  .search-bar input{
    background:none;border:none;outline:none;color:var(--cream); font-family:'Tajawal'; font-size:14px; flex:1;
  }
  .filter-chips{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto;}
  .chip{
    padding:6px 14px; border-radius:100px; background:var(--surface-2); border:1px solid var(--line);
    font-size:12px; font-weight:700; color:var(--cream-dim); white-space:nowrap; cursor:pointer;
  }
  .chip.active{background:var(--gold); color:#20180a; border-color:var(--gold);}
  .chip svg{width:14px; height:14px; vertical-align:-2px;}
  /* reminder option groups: equal-width, same height, tidy icons */
  .rd-seg{display:grid; gap:8px; grid-template-columns:repeat(3,minmax(0,1fr));}
  .rd-seg.c2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .rd-opt{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:54px; padding:8px 6px;
    border-radius:14px; background:var(--surface-2); border:1px solid var(--line); color:var(--cream-dim);
    font-size:13px; font-weight:700; line-height:1.3; text-align:center; cursor:pointer; transition:background .15s,border-color .15s;}
  .rd-opt svg{width:17px; height:17px; flex-shrink:0;}
  .rd-opt small{display:block; font-size:11px; font-weight:600; opacity:.85;}
  .rd-opt.active{background:var(--gold); color:#20180a; border-color:var(--gold);}
  .rd-opt .rd-row{display:flex; align-items:center; gap:5px;}

  /* ---------- Unit list ---------- */
  .unit-card{
    display:flex; align-items:center; gap:12px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px; cursor:pointer;
  }
  .unit-card .thumb{
    width:56px;height:56px;border-radius:12px; flex-shrink:0;
    background:linear-gradient(145deg,#3a3222,#211d14); border:1px solid #4a3f24;
    display:flex;align-items:center;justify-content:center;
  }
  .unit-card .thumb svg{width:28px;height:28px;}
  .unit-card .thumb, .rem-top .rb{overflow:hidden;}
  .uimg{width:100%; height:100%; object-fit:cover; display:block;}
  .ph-grid{display:flex !important; flex-direction:column; gap:8px;}
  .ph-item{display:flex; align-items:center; gap:10px; padding:6px 8px; border:1px solid var(--line); border-radius:12px; background:var(--surface-2);}
  .ph-item .ph-img{width:46px; height:46px; aspect-ratio:auto; flex-shrink:0; border-radius:9px;}
  .ph-item .ph-name{flex:1; text-align:start; margin:0; font-size:13px; padding:6px 4px; background:none;}
  .ph-add.ph-row{display:flex; flex-direction:row; align-items:center; justify-content:center; gap:8px; padding:10px; aspect-ratio:auto;}
  .dp-read{font-family:'Cairo'; font-size:34px; font-weight:800; color:var(--gold-soft); text-align:center; direction:ltr; letter-spacing:1px;}
  .dp-read span{cursor:pointer; padding:0 4px; border-radius:8px;}
  .dp-read span.on{background:rgba(255,255,255,.08);}
  .dp-cap{font-size:12px; color:var(--cream-dim); text-align:center; margin:2px 0 10px;}
  .dp-cols{display:flex; gap:14px; justify-content:center; direction:ltr; margin:6px 0 4px;}
  .dp-col{display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; max-width:140px;}
  .dp-col label{font-size:12px; color:var(--cream-dim); font-weight:700;}
  .dp-col input{width:100%; text-align:center; font-size:26px; font-weight:800; padding:8px 4px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--cream);}
  .dp-btn{width:100%; padding:10px 0; border-radius:12px; border:1px solid var(--line); background:var(--surface-3); color:var(--cream); font-size:20px; font-weight:800; text-align:center; cursor:pointer; user-select:none;}
  .dp-fine{display:flex; gap:8px; justify-content:center; margin-top:4px;}
  .dp-fine .dp-btn{width:auto; padding:6px 16px; font-size:14px;}
  .uimg-edit{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .uimg-edit .pv{width:64px; height:64px; border-radius:16px; overflow:hidden; background:linear-gradient(145deg,#3a3222,#211d14); border:1px solid #4a3f24; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .uimg-edit .pv svg{width:30px; height:30px;}
  .uimg-edit .btns{display:flex; flex-wrap:wrap; gap:8px;}
  .unit-card .info{flex:1; min-width:0;}
  .unit-card .info .n{font-family:'Cairo'; font-weight:700; font-size:14.5px;}
  .unit-card .info .m{font-size:11.5px; color:var(--cream-dim); margin-top:3px;}
  .status-dot{width:10px;height:10px;border-radius:50%; flex-shrink:0;}
  .card-actions{display:flex; gap:6px; flex-shrink:0; margin-inline-start:4px;}
  .mini-icon-btn{width:30px;height:30px;border-radius:9px; background:var(--surface-3); border:1px solid var(--line); display:flex;align-items:center;justify-content:center; cursor:pointer;}
  .mini-icon-btn svg{width:14px;height:14px; opacity:.85;}
  .mini-icon-btn.danger{background:rgba(209,84,74,.15); border-color:rgba(209,84,74,.35); color:#ec8179;}

  /* ---------- Calendar ---------- */
  .month-nav{display:flex; align-items:center; justify-content:space-between; margin:6px 0 14px;}
  .month-nav .mtitle{font-family:'Cairo'; font-weight:800; font-size:20px; letter-spacing:.5px;}
  .month-nav .marrow{
    width:34px;height:34px;border-radius:10px; background:var(--surface-2); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .legend .li{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--cream-dim);}
  .legend .dot{width:9px;height:9px;border-radius:50%;}

  .weekdays{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px;}
  .weekdays span{text-align:center; font-size:10.5px; color:var(--cream-dim); font-weight:700;}
  .daysgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .day{
    aspect-ratio:1/1; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; cursor:pointer; position:relative; color:#0f1116;
  }
  .day.empty-cell{visibility:hidden;}
  .day.avail{background:linear-gradient(160deg,#3bbd88,var(--green)); color:#08251a;}
  .day.rented{background:linear-gradient(160deg,#e4675d,var(--red)); color:#2a0806;}
  .day.prelim{background:linear-gradient(160deg,#f0a54e,var(--orange)); color:#301a02;}
  .day.settled{background:linear-gradient(160deg,#659fcc,var(--blue)); color:#071626;}
  .day.today{box-shadow:0 0 0 2px var(--gold-soft) inset;}
  .day .tag{position:absolute; bottom:3px; font-size:7px; font-weight:800; opacity:.75;}
  .day .paid-badge{
    position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
    background:#0f1116; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,.25);
  }
  .day .paid-badge svg{width:9px; height:9px; stroke:#3bd67a; stroke-width:3;}

  .revenue-strip{
    display:flex; gap:10px; margin-top:18px;
  }
  .stat-card{
    flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:12px;
  }
  .stat-card .lbl{font-size:10.5px; color:var(--cream-dim); font-weight:700;}
  .stat-card .val{font-family:'Cairo'; font-weight:800; font-size:16px; margin-top:4px;}
  .stat-card.green .val{color:var(--green);}
  .stat-card.red .val{color:#ec8179;}
  .stat-card.gold .val{color:var(--gold-soft);}

  .big-btn{
    width:100%; padding:15px; border-radius:16px; border:none; cursor:pointer;
    font-family:'Cairo'; font-weight:800; font-size:14.5px; margin-top:16px;
    background:linear-gradient(145deg,var(--gold-soft),var(--gold-deep)); color:#241a06;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .big-btn:active{filter:brightness(.94);}
  .big-btn.ghost{background:var(--surface-2); color:var(--cream); border:1px solid var(--line);}
  .big-btn.danger{background:linear-gradient(145deg,#e4675d,var(--red)); color:#2a0806;}
  .big-btn.blueish{background:linear-gradient(145deg,#659fcc,var(--blue)); color:#071626;}
  .big-btn svg{width:17px;height:17px;}

  /* ---------- Sheets / modals ---------- */
  .scrim{
    position:absolute; inset:0; background:rgba(4,5,8,.62); z-index:900;
    display:flex; align-items:flex-end; justify-content:center;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  .legal{font-size:12.5px; line-height:1.95; color:var(--cream-dim);}
  .legal h4{color:var(--cream); font-size:13.5px; margin:16px 0 4px;}
  .legal p{margin:4px 0 8px;}
  .legal ul{margin:4px 0 10px; padding-inline-start:20px;}
  .legal li{margin-bottom:5px;}
  .legal .intro{background:var(--surface-3); color:var(--cream); padding:10px 12px; border-radius:10px;}
  .no-anim .scrim, .no-anim .sheet, .no-anim .drawer-scrim, .no-anim .drawer-panel{animation:none !important;}

  .drawer-scrim{
    position:absolute; inset:0; background:rgba(4,5,8,.55); z-index:950;
    animation:fadeIn .18s ease;
  }
  .drawer-panel{
    position:absolute; top:0; bottom:0; left:0;
    width:84%; max-width:340px;
    background:var(--surface);
    border-left:1px solid var(--line);
    box-shadow: 12px 0 40px rgba(0,0,0,.5);
    display:flex; flex-direction:column;
    animation: slideInLeft .22s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes slideInLeft{from{transform:translateX(-100%)} to{transform:translateX(0)}}
  .drawer-head{
    display:flex; align-items:center; gap:8px;
    padding:calc(16px + env(safe-area-inset-top)) 14px 14px;
    border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .drawer-body{ flex:1; overflow-y:auto; padding:14px 14px calc(20px + var(--safe-b)); }
  .settings-menu-item{
    display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer;
  }
  .settings-menu-icon{
    width:36px; height:36px; border-radius:10px; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold-soft);
  }
  .settings-menu-icon svg{width:17px; height:17px;}
  .settings-menu-item svg:last-child{width:16px; height:16px; opacity:.4; flex-shrink:0;}
  .sheet{
    width:100%; max-height:88%; background:var(--surface);
    border-radius:26px 26px 0 0; border:1px solid var(--line); border-bottom:none;
    display:flex; flex-direction:column;
    animation:slideUp .22s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:.4} to{transform:translateY(0); opacity:1}}
  .sheet .grabber{width:40px;height:4px;border-radius:3px;background:var(--line); margin:10px auto 4px;}
  .sheet.full{max-height:100%; height:100%; border-radius:0; border:none;}
  .sheet.full .grabber{display:none;}
  .sheet.full .sheet-head{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;}
  .sheet.full .sheet-head h3{font-size:17px;}
  .sheet.full .sheet-body{flex:1; padding:12px 16px 14px;}
  .sheet.full .table{font-size:15px;}
  .sheet.full .table th{font-size:12.5px; padding:11px 6px; width:34%;}
  .sheet.full .table td{padding:11px 6px;}
  .sheet.full .sheet-actions{flex-direction:row; flex-wrap:wrap; gap:8px; padding:10px 14px calc(12px + var(--safe-b));}
  .sheet.full .sheet-actions .big-btn{flex:1 1 calc(50% - 8px); min-width:0; padding:9px 6px; font-size:12.5px; border-radius:12px; gap:5px; min-height:0; line-height:1.25;}
  .sheet.full .sheet-actions .big-btn svg{width:15px; height:15px;}
  .sheet-head{
    display:flex; align-items:center; gap:10px; padding:8px 18px 12px; border-bottom:1px solid var(--line);
  }
  .sheet-head h3{font-size:16px; flex:1;}
  .sheet-body{
    padding:16px 18px calc(22px + var(--safe-b));
    overflow-y:auto;
  }
  .sheet-actions{
    padding:14px 18px calc(20px + var(--safe-b));
    border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:10px;
    /* ensures action buttons always sit above the phone home-indicator gesture bar */
  }

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--cream-dim); font-weight:700; margin-bottom:6px;}
  .field input[type=text], .field input[type=tel], .field textarea, .field input[type=number]{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:12px 12px; color:var(--cream); font-family:'Tajawal'; font-size:14px; outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--gold);}
  .field textarea{resize:none; min-height:64px;}
  .row2{display:flex; gap:10px;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-inline-end:46px !important;}

  }

const CLOCK_KEY = 'ejar_clock_fmt';
function getClockPref(){ try{ return localStorage.getItem(CLOCK_KEY) || '24'; }catch(e){ return '24'; } }

function clockIs12(){
  const p = getClockPref();
  if(p==='12') return true;
  if(p==='24') return false;
  try{ return !!new Intl.DateTimeFormat(navigator.language || undefined, {hour:'numeric'}).resolvedOptions().hour12; }catch(e){ return false; }
}
/* 'HH:MM' (24h, how times are stored) -> text shown to the user according to the chosen clock format */
function fmtClock(hhmm){
  if(!hhmm) return '';
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm));
  if(!m) return hhmm;
  const h = +m[1], mi = m[2];
  if(!clockIs12()) return String(h).padStart(2,'0') + ':' + mi;
  const h12 = (h%12)===0 ? 12 : h%12;
  return h12 + ':' + mi + ' ' + (h>=12 ? 'م' : 'ص');
}

function makeUnitImg(file){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = ()=>{
      try{
        const S = 160, c = document.createElement('canvas'); c.width = c.height = S;
        const side = Math.min(im.width, im.height), sx = (im.width-side)/2, sy = (im.height-side)/2;
        c.getContext('2d').drawImage(im, sx, sy, side, side, 0, 0, S, S);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
      }catch(e){ rej(e); }
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}

function openDurPicker(opts){
  openModalOrSwap(Object.assign({type:'durPicker', mode:DP_MODE, step:'hour', hi:0}, opts));
}
function openModalOrSwap(m){ if(state.modal) swapModal(m); else openModal(m); }
function bindDurPicker(m){
  const upd = (v)=>{ m.val = Math.max(0, Math.min(10079, v)); swapModal(m); };
  document.querySelectorAll('[data-dp-mode]').forEach(el=> el.onclick = ()=>{ DP_MODE = m.mode = el.dataset.dpMode; swapModal(m); });
  document.querySelectorAll('[data-dp-step]').forEach(el=> el.onclick = ()=>{ m.step = el.dataset.dpStep; swapModal(m); });
  document.querySelectorAll('[data-dp-hi]').forEach(el=> el.onclick = ()=>{ m.hi = +el.dataset.dpHi; swapModal(m); });
  document.querySelectorAll('[data-dp-hour]').forEach(el=> el.onclick = ()=>{ const dd = Math.floor(m.val/1440), mi = m.val%60; m.val = dd*1440 + (+el.dataset.dpHour)*60 + mi; m.step = 'minute'; swapModal(m); });
  document.querySelectorAll('[data-dp-min]').forEach(el=> el.onclick = ()=>{ m.val = Math.floor(m.val/60)*60 + (+el.dataset.dpMin); swapModal(m); });
  document.querySelectorAll('[data-dp-add]').forEach(el=> el.onclick = ()=>{
    const k = el.dataset.dpAdd, dd = Math.floor(m.val/1440), h = Math.floor((m.val%1440)/60), mi = m.val%60;
    if(k==='h1') upd(dd*1440 + Math.min(23,h+1)*60 + mi);
    else if(k==='h-1') upd(dd*1440 + Math.max(0,h-1)*60 + mi);
    else if(k==='d1') upd(Math.min(6,dd+1)*1440 + h*60 + mi);
    else if(k==='d-1') upd(Math.max(0,dd-1)*1440 + h*60 + mi);
    else upd(m.val + (+k.slice(1)));
  });
  const dI = document.getElementById('dpD'), hi = document.getElementById('dpH'), mm = document.getElementById('dpM');
  const fromInputs = ()=>{
    const dd = Math.max(0, Math.min(6, parseInt(dI.value,10)||0)), h = Math.max(0, Math.min(23, parseInt(hi.value,10)||0)), mi = Math.max(0, Math.min(59, parseInt(mm.value,10)||0));
    m.val = dd*1440 + h*60+mi;
    const rd = document.getElementById('dpRead'); if(rd) rd.textContent = pad(h)+':'+pad(mi);
    const sm = document.getElementById('dpSum'); if(sm) sm.textContent = m.val>0 ? tr('التنبيه قبل الموعد بـ ')+tr(reminderLabel(m.val)) : tr('اختر مدة أكبر من صفر');
  };
  if(dI) dI.oninput = fromInputs;
  if(hi) hi.oninput = fromInputs;
  if(mm) mm.oninput = fromInputs;
  document.getElementById('dpOk').onclick = ()=>{
    if(!(m.val>0)){ toast('اختر مدة أكبر من صفر'); return; }
    const a = m.apply;
    if(a.kind==='rd'){ m.back.draft[a.key] = m.val; swapModal(m.back); }
    else { NOTIF[a.key] = m.val; scheduleCloudSync(); scheduleNativeReminders(true); closeModal(); refreshSettingsOrScreen(); }
  };
}
function reminderLabel(mins){
  if(mins >= 1440){ const d = Math.floor(mins/1440), r = mins%1440; return d + ' يوم' + (r ? ' و ' + reminderLabel(r) : ''); }
  if(mins < 60) return mins + ' دقيقة';
  if(mins % 60 === 0){
    const h = mins/60;
    return h===1?'ساعة واحدة':(h===2?'ساعتين':h+' ساعات');
  }
  return Math.floor(mins/60) + ' س ' + (mins%60) + ' د';
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.6);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.6);
  }catch(e){}
}

async function showAppNotification(title, options){
  title = tr(title); if(options && options.body) options = Object.assign({}, options, {body: tr(options.body)});
  try{
    if(isNativeApp() && window.Capacitor.Plugins.LocalNotifications){
      await ensureNativeChannels();
      await window.Capacitor.Plugins.LocalNotifications.schedule({ notifications: [{
        id: 1000000000 + Math.floor(Math.random()*1000000000),
        title, body: options.body||'',
        channelId: NATIVE_CH[getNotifTonePref()],
        smallIcon: 'ic_stat_icon', largeIcon: 'ejar_large', iconColor: '#d4af37',
        sound: NOTIF_TONES[getNotifTonePref()],
        schedule: { at: new Date(Date.now()+300) }
      }]});
      return true;
    }
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.ready;
      if(reg && reg.showNotification){
        await reg.showNotification(title, options);
        return true;
      }
    }
    new Notification(title, options);
    return true;
  }catch(e){
    return false;
  }
}
function fireReminder(e){
  const {title, body} = reminderText(e);
  if(!isNativeApp()) playBeep();
  showAppNotification(title, {body, icon:'icon-192.png'}).then(ok=>{ if(!ok) toast(title+': '+body); });
}
function checkReminders(){
  if(isNativeApp()) return; // inside the Android app, reminders are pre-scheduled natively (see scheduleNativeReminders)
  if(!NOTIF.enabled) return;
  const now = Date.now();
  const notified = getNotifiedSet();
  BOOKINGS.forEach(b=> remEntries(b).forEach(e=>{
    const key = b.id+':'+e.field+(e.kind==='early'?':early':'');
    if(notified.has(key)) return;
    if(now >= e.at && now <= e.evAt){ fireReminder(e); markNotified(key); }
  }));
}

const NATIVE_CH = {short:'ejar_short', double:'ejar_double', alarm:'ejar_alarm'};

const EXTRA_PRESETS = [720, 1440, 2880];
const EXTRA_LABELS = {0:'بدون', 720:'12 ساعة', 1440:'قبل يوم', 2880:'قبل يومين'};
/* per-booking reminder settings live in booking.rem = {on:false?, ci:min|0?, co:min|0?, ex:min?, pay:true?, tone:'short'|'double'|'alarm'?}
   (missing field = use the global default; ci/co = 0 means "no reminder") */
function remCfg(b){
  const r = b.rem || {};
  return {on: r.on!==false, ci: (r.ci==null?null:r.ci), co: (r.co==null?null:r.co), ex: r.ex||0, pay: !!r.pay, tone: r.tone||null};
}
function remMins(b, field){
  const c = remCfg(b); if(!c.on) return 0;
  const v = field==='checkin' ? c.ci : c.co;
  if(v===null) return field==='checkin' ? NOTIF.beforeCheckin : NOTIF.beforeCheckout;
  return v;
}
function remIsCustom(b){ const r = b.rem; return !!r && (r.on===false || r.ci!=null || r.co!=null || !!r.ex || !!r.pay || !!r.tone); }
function remEntries(b){
  const out = [];
  if(!b.name) return out;
  const c = remCfg(b); if(!c.on) return out;
  [['checkin','الاستلام'], ['checkout','التسليم']].forEach(([field, label])=>{
    const t = b[field]; if(!t) return;
    const [hh,mm] = t.split(':').map(Number); if(isNaN(hh)||isNaN(mm)) return;
    const ev = new Date(((field==='checkout' && b.endDate) ? b.endDate : b.date)+'T00:00:00'); ev.setHours(hh, mm, 0, 0);
    const mins = remMins(b, field);
    if(mins>0) out.push({at: ev.getTime()-mins*60000, evAt: ev.getTime(), b, field, kind:'main', label, time:t, tone:c.tone});
    if(field==='checkin' && c.ex>0) out.push({at: ev.getTime()-c.ex*60000, evAt: ev.getTime(), b, field, kind:'early', label, time:t, tone:c.tone});
  });
  return out;
}
function reminderText(e){
  const u = unitById(e.b.unitId);
  const title = (e.kind==='early' ? tr('تذكير مسبق') : tr('تذكير')) + ' ' + tr(e.label);
  let body = `${u?u.name:''} — ${e.b.name} · ${tr('الساعة')} ${e.time}`;
  if(remCfg(e.b).pay && e.field==='checkin'){
    const left = remainingAmt(e.b);
    if(left>0) body += ` · ${tr('المتبقي')}: ${fmtMoney(left)} ${tr(CUR_SHORT[e.b.currency||'SYP']||'')}`;
  }
  return {title, body};
}
function fmtDT(ms){ const d = new Date(ms); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+fmtClock(pad(d.getHours())+':'+pad(d.getMinutes())); }
function buildReminderList(){
  const out = [], now = Date.now();
  if(!NOTIF.enabled) return out;
  BOOKINGS.forEach(b=> remEntries(b).forEach(e=>{ if(e.at > now+5000) out.push(e); }));
  out.sort((x,y)=>x.at-y.at);
  return out.slice(0,150); // Android keeps a limited number of alarms per app
}
let reminderSig = '', reminderTimer = null, reminderBusy = false;
function scheduleNativeReminders(force){
  if(!isNativeApp()) return;
  clearTimeout(reminderTimer);
  reminderTimer = setTimeout(()=>runNativeReminders(force), 1500);
}
async function runNativeReminders(force){
  const LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
  if(!LN) return;
  if(reminderBusy){ scheduleNativeReminders(force); return; }
  reminderBusy = true;
  try{
    const list = buildReminderList();
    const tone = getNotifTonePref();
    const sig = tone+'#'+list.map(x=> x.b.id+x.field+x.kind+x.at+(x.tone||'')+reminderText(x).body).join(';');
    if(!force && sig===reminderSig) return;
    const perm = await getNativeNotifPermission();
    if(perm!=='granted') return; // retried automatically once the permission is granted
    await ensureNativeChannels();
    const pend = await LN.getPending();
    const mine = ((pend && pend.notifications)||[]).filter(n=>n.id < 1000000000);
    if(mine.length) await LN.cancel({notifications: mine.map(n=>({id:n.id}))});
    if(list.length){
      await LN.schedule({notifications: list.map((x,i)=>{
        const t = reminderText(x), tn = x.tone || tone;
        return {
          id: i+1,
          title: t.title,
          body: t.body,
          channelId: NATIVE_CH[tn],
          smallIcon: 'ic_stat_icon', largeIcon: 'ejar_large', iconColor: '#d4af37',
          sound: NOTIF_TONES[tn],
          schedule: { at: new Date(x.at), allowWhileIdle: true },
          extra: { bid: x.b.id, date: x.b.date }
        };
      })});
    }
    reminderSig = sig;
  }catch(e){ console.warn('reminder scheduling failed', e); }
  finally{ reminderBusy = false; }
}

    resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';

  if(metaTheme) metaTheme.setAttribute('content', resolved==='light' ? '#f7f4ee' : '#0d0f14');

async function pushToCloud(){
  if(!authUser || accountDeleting) return;
  if(!cloudDb){ syncStatus='offline'; refreshSyncBadge(); return; }
  syncStatus = 'syncing'; refreshSyncBadge();
  const updatedAt = Date.now();
  lastAppliedUpdatedAt = updatedAt; // set BEFORE writing — Firestore fires an immediate local echo
                                     // of our own write before the server confirms; this stops that
                                     // echo from being treated as a "remote change" and re-rendering.
  const payload = {UNITS, EXPENSES, NOTIF, unitSeq, idSeq, pinnedUnitId, pinnedCatId, updatedAt, updatedBy: getUserName()||authUser.email||'مستخدم', subscriptionExpiresAt: subscriptionExpiresAt, ownerEmail: authUser.email||null, businessName: businessName||''};   // (legacy ownerPin/devices are no longer written: roles live in members/{uid})
  try{
    if(workspaceUid && !bookingsV2){ syncStatus = 'synced'; refreshSyncBadge(); return; }   // old-format business: members only look
    if(bookingsV2) payload.bookingsV2 = true; else payload.BOOKINGS = BOOKINGS;
    if(!workspaceUid){
      await wsRef(authUser.uid).set(payload);            // owner: the business document (bookings are separate documents)
    } else if(memberStatus==='active' && (userRole==='assistant' || userRole==='manager')){
      /* members send only the fields their role may change; Firestore rules enforce the same on the server */
      const core = {UNITS, EXPENSES, unitSeq, idSeq, updatedAt, updatedBy: payload.updatedBy};
      if(userRole==='manager') Object.assign(core, {NOTIF, pinnedUnitId, pinnedCatId});
      await wsRef(workspaceUid).update(core);
    }
    const okB = await pushBookings();
    syncStatus = okB===false ? 'error' : 'synced';
  }catch(e){
    syncStatus = 'error';
    if(workspaceUid && e && e.code==='permission-denied') recheckMembership();
  }
  refreshSyncBadge();
}

/* Live listener: reflects changes from ANY device signed into the same account immediately */
function startCloudListener(uid){
  if(!cloudDb || !uid) return;
  if(unsubscribeSnapshot) unsubscribeSnapshot();
  unsubscribeSnapshot = wsRef(uid).onSnapshot(
    (doc)=>{
      if(!doc.exists) return;
      const data = doc.data();
      if(!data.updatedAt || data.updatedAt <= lastAppliedUpdatedAt) return;
      const isOwnEcho = data.updatedBy===(getUserName()||authUser?.email) && (Date.now()-data.updatedAt) < 4000;
      lastAppliedUpdatedAt = data.updatedAt;
      applyCloudData(data);
      saveStateLocalOnly();
      if(!isOwnEcho){
        toast(`تحديث جديد من ${data.updatedBy||'مستخدم آخر'}`);
      }
      syncStatus = 'synced';
      render();
    },
    (err)=>{ syncStatus='error'; refreshSyncBadge(); if(workspaceUid && err && err.code==='permission-denied') recheckMembership(); }
  );
}

async function fetchInvite(code){
  code = (code||'').trim().toUpperCase();
  if(!/^[A-Z2-9]{10}$/.test(code)) return {ok:false, msg:'رمز الدعوة غير صحيح'};
  try{
    const d = await cloudDb.collection('invites').doc(code).get();
    if(!d.exists) return {ok:false, msg:'رمز الدعوة غير صحيح'};
    const v = d.data();
    if(v.used) return {ok:false, msg:'تم استخدام هذه الدعوة من قبل'};
    if(!(v.expiresAt > Date.now())) return {ok:false, msg:'انتهت صلاحية الدعوة'};
    return {ok:true, code, data:v};
  }catch(e){ return {ok:false, msg:'تأكد من اتصال الإنترنت ثم حاول مرة أخرى'}; }
}
async function joinWithInvite(code, displayName){
  const r = await fetchInvite(code); if(!r.ok) return r;
  const uid = authUser.uid, owner = r.data.ownerUid;
  if(owner===uid) return {ok:false, msg:'لا يمكنك الانضمام إلى حسابك الخاص'};
  try{
    const b = cloudDb.batch();
    b.set(wsRef(owner).collection('members').doc(uid), {role:r.data.role, email:authUser.email||'', name:displayName||'', status:'active', joinedAt:Date.now(), inviteCode:r.code});
    b.update(cloudDb.collection('invites').doc(r.code), {used:true, usedBy:uid, usedAt:Date.now()});
    b.set(cloudDb.collection('memberships').doc(uid), {ownerUid:owner});
    await b.commit();
  }catch(e){ return {ok:false, msg:'تعذّر الانضمام. تأكد من صلاحية الدعوة وحاول مرة أخرى'}; }
  if(displayName) setUserName(displayName);
  return {ok:true, ownerUid:owner, role:r.data.role};
}

      UNITS = []; BOOKINGS = []; EXPENSES = []; DEVICES = {};
      unitSeq = 1; idSeq = 100; pinnedUnitId = null; pinnedCatId = null; bookingsV2 = true;

  render();
}

let bookingsV2 = false, cloudBk = {}, unsubBookings = null, bkRetryTimer = null;
const BK_ALLOWED = ['id','unitId','date','endDate','name','phone','checkin','checkout','total','deposit','damageFee','notes','photos','currency','rating','tenantNote','status','settled','settledBy','createdBy','updatedBy','rem'];
const BK_STAMPS = ['createdByUid','createdAtMs','updatedByUid','updatedAtMs','rev','lastAudit'];
const bkRef = (o)=> wsRef(o).collection('bookings');
function stable(v){
  if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined ? null : v);
}
function bkCore(b){ const c = {}; BK_ALLOWED.forEach(k=>{ if(b[k]!==undefined) c[k] = JSON.parse(JSON.stringify(b[k])); }); return c; }
function rndHex(n){ try{ const a = new Uint8Array(n); (window.crypto||window.msCrypto).getRandomValues(a); return Array.from(a, x=>(x%36).toString(36)).join(''); }catch(e){ return Math.random().toString(36).slice(2,2+n); } }

function stopBookingsListener(){ if(unsubBookings){ unsubBookings(); unsubBookings = null; } }
function startBookingsListener(o){
  if(!cloudDb || !o) return;
  stopBookingsListener();
  let first = true;
  unsubBookings = bkRef(o).onSnapshot((snap)=>{
    let remote = 0, who = '';
    if(first){
      first = false; cloudBk = {}; const arr = [];
      snap.docs.forEach(d=>{ const x = d.data(); cloudBk[d.id] = {doc:x, core:stable(bkCore(x))}; arr.push(x); });
      BOOKINGS = arr;
    } else {
      snap.docChanges().forEach(ch=>{
        const id = ch.doc.id;
        if(ch.type==='removed'){ if(cloudBk[id]){ delete cloudBk[id]; BOOKINGS = BOOKINGS.filter(b=>b.id!==id); remote++; } return; }
        if(ch.doc.metadata && ch.doc.metadata.hasPendingWrites) return;      // our own write, still travelling
        const x = ch.doc.data();
        if(cloudBk[id] && stable(x)===stable(cloudBk[id].doc)) return;         // already known (our own write)
        cloudBk[id] = {doc:x, core:stable(bkCore(x))};
        const i = BOOKINGS.findIndex(b=>b.id===id);
        if(i>=0) BOOKINGS[i] = x; else BOOKINGS.push(x);
        if(!authUser || x.updatedByUid!==authUser.uid){ remote++; who = x.updatedBy || x.createdBy || who; }
      });
    }
    saveStateLocalOnly();
    if(remote) toast('تحديث جديد من '+(who||'مستخدم آخر'));
    syncStatus = 'synced';
    render();
  }, (err)=>{ syncStatus='error'; refreshSyncBadge(); if(workspaceUid && err && err.code==='permission-denied') recheckMembership(); });
}
function bkAudit(j){
  const base = j.doc || j.prev || {};
  return {bid:j.id, op:j.op, rev:(j.op==='delete' ? ((j.prev&&j.prev.rev)||0) : j.doc.rev), by:authUser.uid, byName:(getUserName()||authUser.email||'').slice(0,60), at:Date.now(), tn:String(base.name||'').slice(0,60), prev: j.prev ? stable(bkCore(j.prev)).slice(0,1800) : ''};
}
/* Sends only the bookings that changed (one small batch per booking: the document + its audit entry). */
async function pushBookings(){
  if(accountDeleting) return true;
  if(!bookingsV2 || !cloudDb || !authUser) return true;
  if(workspaceUid && (memberStatus!=='active' || userRole==='guest')) return true;
  const o = wsUid(), uid = authUser.uid, now = Date.now(), jobs = [], seen = new Set();
  BOOKINGS.forEach(b=>{
    if(!b) return;
    if(!b.id) b.id = newBookingKey();
    seen.add(b.id);
    const core = bkCore(b), cs = stable(core), base = cloudBk[b.id];
    if(!base){
      jobs.push({id:b.id, op:'create', prev:null, doc:Object.assign({}, core, {createdByUid:uid, createdAtMs:now, rev:1, updatedByUid:uid, updatedAtMs:now})});
    } else if(base.core!==cs){
      jobs.push({id:b.id, op:'update', prev:base.doc, doc:Object.assign({}, core, {createdByUid:base.doc.createdByUid, createdAtMs:base.doc.createdAtMs, rev:(base.doc.rev||0)+1, updatedByUid:uid, updatedAtMs:now})});
    }
  });
  Object.keys(cloudBk).forEach(id=>{ if(!seen.has(id)) jobs.push({id, op:'delete', prev:cloudBk[id].doc, doc:null}); });
  if(!jobs.length) return true;
  let denied = false, failed = false;
  for(let i=0;i<jobs.length;i+=15){
    await Promise.all(jobs.slice(i,i+15).map(async j=>{
      try{
        const batch = cloudDb.batch(), ref = bkRef(o).doc(j.id);
        // the audit entry is bound to the booking change: the server refuses a change that has no matching entry
        const aRef = j.op==='delete' ? wsRef(o).collection('audit').doc(j.id+'_del') : wsRef(o).collection('audit').doc();
        if(j.op==='delete') batch.delete(ref); else { j.doc.lastAudit = aRef.id; batch.set(ref, j.doc); }
        batch.set(aRef, bkAudit(j));
        await batch.commit();
        if(j.op==='delete') delete cloudBk[j.id];
        else {
          cloudBk[j.id] = {doc:j.doc, core:stable(bkCore(j.doc))};
          const lb = BOOKINGS.find(x=>x.id===j.id); if(lb) BK_STAMPS.forEach(k=>{ lb[k] = j.doc[k]; });
        }
      }catch(e){
        if(e && e.code==='permission-denied'){            // the server refused: undo this change locally
          denied = true;
          if(j.op==='create') BOOKINGS = BOOKINGS.filter(x=>x.id!==j.id);
          else { const k = BOOKINGS.findIndex(x=>x.id===j.id), old = JSON.parse(JSON.stringify(j.prev)); if(k>=0) BOOKINGS[k] = old; else BOOKINGS.push(old); }
        } else failed = true;
      }
    }));
  }
  if(denied){ saveStateLocalOnly(); toast('ليست لديك صلاحية لهذا الإجراء'); render(); if(workspaceUid) recheckMembership(); }
  if(failed){ clearTimeout(bkRetryTimer); bkRetryTimer = setTimeout(scheduleCloudSync, 20000); }
  return !failed;
}
/* one-time upgrade of an existing business: copy the bookings array into documents, then drop the array */
async function migrateBookingsV2(){
  const o = authUser.uid, now = Date.now(), byId = {};
  BOOKINGS.forEach(b=>{ if(!b) return; if(!b.id) b.id = newBookingKey(); byId[b.id] = b; });
  const list = Object.values(byId);
  for(let i=0;i<list.length;i+=200){
    const batch = cloudDb.batch();
    list.slice(i,i+200).forEach(b=>{ batch.set(bkRef(o).doc(b.id), Object.assign({}, bkCore(b), {createdByUid:o, createdAtMs:now, rev:1, updatedByUid:o, updatedAtMs:now})); });
    await batch.commit();
  }
  await wsRef(o).update({bookingsV2:true, BOOKINGS: firebase.firestore.FieldValue.delete(), updatedAt: Date.now()});
  bookingsV2 = true;
}

/* ---- app lock (4-digit PIN kept as a salted SHA-256 hash on this device only) ---- */
const LOCK_KEY = 'ejar_lock_v1';
function lockCfg(){ try{ return JSON.parse(localStorage.getItem(LOCK_KEY)||'null'); }catch(e){ return null; } }
function lockSupported(){ return !!(window.crypto && window.crypto.subtle && window.TextEncoder); }
async function lockHash(pin, salt){ const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pin)); return Array.from(new Uint8Array(h), x=>x.toString(16).padStart(2,'0')).join(''); }
let lockFails = 0, lockUntil = 0, lockHiddenAt = 0;
function lockClose(){ const o = document.getElementById('applock'); if(o) o.remove(); }
/* mode: 'unlock' | 'set' | 'off'  — done() runs after success */
function lockShow(mode, done){
  lockClose();
  const o = document.createElement('div'); o.id = 'applock';
  o.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0d0f14;color:#f2ead3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:inherit;direction:rtl;padding:24px;';

    + '<div id="lkDots" style="display:flex;gap:14px;direction:ltr"></div>'
    + '<div id="lkMsg" style="min-height:20px;color:#e8b4b4;font-size:14px;text-align:center"></div>'
    + '<div id="lkPad" style="display:grid;grid-template-columns:repeat(3,72px);gap:12px;direction:ltr"></div>'
    + '<div id="lkLinks" style="display:flex;gap:18px;font-size:14px"></div>';
  document.body.appendChild(o);
  const $ = id=>o.querySelector('#'+id);
  let pin = '', first = null, busy = false;
  const title = ()=>{ $('lkTitle').textContent = tr(mode==='unlock' ? 'أدخل الرمز السري' : mode==='off' ? 'أدخل الرمز الحالي لإيقاف القفل' : (first===null ? 'اختر رمزًا سريًا من 4 أرقام' : 'أعد إدخال الرمز للتأكيد')); };
  const dots = ()=>{ $('lkDots').innerHTML = [0,1,2,3].map(i=>'<span style="width:14px;height:14px;border-radius:50%;border:2px solid #d4af37;background:'+(i<pin.length?'#d4af37':'transparent')+'"></span>').join(''); };
  const msg = t=>{ $('lkMsg').textContent = t ? tr(t) : ''; };
  const keyBtn = (label, fn)=>{ const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.style.cssText = 'height:64px;border-radius:50%;border:1px solid rgba(212,175,55,.35);background:#171a22;color:#f2ead3;font-size:24px;font-family:inherit;'+(label===''?'visibility:hidden;':'');
    b.onclick = fn; $('lkPad').appendChild(b); };
  async function submit(){
    busy = true;
    try{
      const cfg = lockCfg();
      if(mode==='set'){
        if(first===null){ first = pin; pin = ''; title(); dots(); msg(''); busy = false; return; }
        if(first!==pin){ first = null; pin = ''; title(); dots(); msg('الرمزان غير متطابقين، حاول مجددًا'); busy = false; return; }
        const salt = Array.from(crypto.getRandomValues(new Uint8Array(12)), x=>x.toString(16).padStart(2,'0')).join('');
        localStorage.setItem(LOCK_KEY, JSON.stringify({salt, hash: await lockHash(pin, salt)}));
        lockClose(); toast('تم تفعيل قفل التطبيق'); if(done) done(); return;
      }
      const wait = lockUntil - Date.now();
      if(wait>0){ pin = ''; dots(); $('lkMsg').textContent = tr('محاولات كثيرة، انتظر')+' '+Math.ceil(wait/1000)+' s'; busy = false; return; }
      if(cfg && (await lockHash(pin, cfg.salt))===cfg.hash){
        lockFails = 0;
        if(mode==='off'){ localStorage.removeItem(LOCK_KEY); toast('تم إيقاف قفل التطبيق'); }
        lockClose(); if(done) done(); return;
      }
      lockFails++; if(lockFails>=5) lockUntil = Date.now() + Math.min(300, 15*(lockFails-4))*1000;
      pin = ''; dots(); msg('الرمز غير صحيح');
    }catch(e){ pin = ''; dots(); }
    busy = false;
  }
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>keyBtn(k, ()=>{
    if(busy) return;
    if(k==='⌫'){ pin = pin.slice(0,-1); dots(); return; }
    if(k===''||pin.length>=4) return;
    pin += k; dots(); if(pin.length===4) submit();
  }));
  if(mode==='unlock'){
    const f = document.createElement('button'); f.type='button'; f.textContent = tr('نسيت الرمز؟ تسجيل الخروج');
    f.style.cssText = 'background:none;border:0;color:#d4af37;font-family:inherit;font-size:14px;';
    f.onclick = ()=>{ if(confirm(tr('سيتم تسجيل خروجك من هذا الجهاز وتبقى بياناتك محفوظة في السحابة. متابعة؟'))){ localStorage.removeItem(LOCK_KEY); lockClose(); logOut(); } };
    $('lkLinks').appendChild(f);
  } else {
    const c = document.createElement('button'); c.type='button'; c.textContent = tr('إلغاء');
    c.style.cssText = 'background:none;border:0;color:#d4af37;font-family:inherit;font-size:14px;';
    c.onclick = ()=>lockClose(); $('lkLinks').appendChild(c);
  }
  title(); dots();
}

/* ---- brute-force guard (device-side): limits wrong logins / wrong owner PINs ---- */
const GUARD_KEY = 'ejar_guard_v1';
function guardLoad(){ try{ return JSON.parse(localStorage.getItem(GUARD_KEY)||'{}'); }catch(e){ return {}; } }
function guardSave(g){ try{ localStorage.setItem(GUARD_KEY, JSON.stringify(g)); }catch(e){} }
function guardKeys(kind, id){ const k = String(id||'_').trim().toLowerCase() || '_'; return kind==='login' ? ['l:'+k, 'dev'] : ['p:'+k]; }
function guardRemaining(kind, id){
  const g = guardLoad(), now = Date.now();
  return guardKeys(kind,id).reduce((m,k)=>{ const e = g[k]; return Math.max(m, e && e.lockUntil>now ? e.lockUntil-now : 0); }, 0);
}
function guardFail(kind, id){
  const g = guardLoad(), now = Date.now();
  guardKeys(kind,id).forEach(k=>{
    const limit = (k==='dev') ? 12 : 5;
    const e = g[k] || {fails:0, level:0, lockUntil:0, last:0};
    if(now-e.last > 30*60000 && e.lockUntil < now){ e.fails = 0; }
    e.fails++; e.last = now;
    if(e.fails >= limit){ e.level = (e.level||0)+1; e.lockUntil = now + Math.min(5*Math.pow(2, e.level-1), 60)*60000; e.fails = 0; }
    g[k] = e;
  });
  guardSave(g);
  return guardRemaining(kind, id);
}
function guardOk(kind, id){
  const g = guardLoad();
  guardKeys(kind,id).forEach(k=>{ if(k==='dev'){ if(g[k]) g[k].fails = 0; } else delete g[k]; });
  guardSave(g);
}
function fmtLock(ms){ const t = Math.ceil(ms/1000); return pad(Math.floor(t/60))+':'+pad(t%60); }
function lockText(ms){ return 'محاولات كثيرة خاطئة، حاول بعد '+fmtLock(ms); }
let lockTicker = null;
let resetTicker = null;
function bindLockTicker(kind, getId, msgId, btnId){
  clearInterval(lockTicker);
  const upd = ()=>{
    const msg = document.getElementById(msgId), btn = document.getElementById(btnId);
    if(!msg){ clearInterval(lockTicker); return; }
    const rem = guardRemaining(kind, getId());
    if(rem>0){ msg.style.display = 'block'; msg.textContent = tr(lockText(rem)); if(btn){ btn.disabled = true; btn.style.opacity = '.5'; } }
    else { msg.style.display = 'none'; if(btn){ btn.disabled = false; btn.style.opacity = ''; } }
  };
  upd(); lockTicker = setInterval(upd, 1000);
  return upd;
}
/* password-reset code: 30 s between sends, max 5 per hour */
const RESET_COOLDOWN_MS = 30000;
function resetStoreKey(email){ return 'ejar_reset_'+String(email||'').trim().toLowerCase(); }
function resetInfo(email){ try{ return JSON.parse(localStorage.getItem(resetStoreKey(email))||'{}'); }catch(e){ return {}; } }
function resetCooldownLeft(email){ const i = resetInfo(email); return Math.max(0, RESET_COOLDOWN_MS - (Date.now()-(i.last||0))); }
function resetHourlyLimitHit(email){ const i = resetInfo(email); return (i.hourStart && Date.now()-i.hourStart < 3600000) && (i.count||0) >= 5; }
function resetRecordSend(email){
  const i = resetInfo(email), now = Date.now();
  if(!i.hourStart || now-i.hourStart >= 3600000){ i.hourStart = now; i.count = 0; }
  i.count = (i.count||0)+1; i.last = now;
  try{ localStorage.setItem(resetStoreKey(email), JSON.stringify(i)); }catch(e){}
}

async function verifyOwnerProof(pin, pw){
  if(!authUser) return {ok:false, msg:'سجّل الدخول أولًا'};
  if(guardRemaining('pin', authUser.uid)>0) return {ok:false, msg:lockText(guardRemaining('pin', authUser.uid))};
  pin = (pin||'').trim(); pw = pw||'';
  if(accountOwnerPin){ pw = ''; if(!pin) return {ok:false, msg:'أدخل رمز PIN للمالك'}; }   // staff share the account password, so only the PIN proves ownership
  if(!pin && !pw) return {ok:false, msg:'اكتب رمز PIN أو كلمة مرور الحساب'};
  if(pin){
    if(accountOwnerPin && pin===accountOwnerPin){ guardOk('pin', authUser.uid); return {ok:true}; }
    if(!pw){ const rem = guardFail('pin', authUser.uid); return {ok:false, msg: rem>0 ? lockText(rem) : 'رمز PIN غير صحيح'}; }
  }
  if(pw){
    try{
      const u = firebase.auth().currentUser;
      if(!u || !u.email) throw new Error('nouser');
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, pw));
      guardOk('pin', authUser.uid); return {ok:true};
    }catch(e){
      if(e && (e.code==='auth/network-request-failed' || e.message==='nouser')) return {ok:false, msg:'تأكد من اتصال الإنترنت ثم حاول مرة أخرى'};
      const rem = guardFail('pin', authUser.uid);
      return {ok:false, msg: rem>0 ? lockText(rem) : 'كلمة المرور غير صحيحة'};
    }
  }
  return {ok:false, msg:'تعذّر التحقق'};
}

/* One logical "back" for everything: close the open sheet first, then the drawer, then go to the parent page

let navStack = [{type:'view', view:'home', extra:{}}];

}

function pushHistoryEntry(){
  if(!HISTORY_OK || sentinelOn || nativeBackOK()) return;
  try{ history.pushState({ejar:1}, '', location.pathname + location.search); sentinelOn = true; }
  catch(e){
    try{ history.pushState({ejar:1}, ''); sentinelOn = true; }

  const m = state.modal;
  if(m){
    if(m.type==='timePicker' && m.__bookingState){ swapModal({...m.__bookingState, type:'booking'}); return true; }

/* A booking occupies [date+checkin , endDate+checkout]. Old bookings without endDate keep occupying the whole day. */
function bkInterval(b){
  const s0 = new Date(b.date+'T00:00:00');
  if(!b.endDate){ const e0 = new Date(s0); e0.setDate(e0.getDate()+1); return {s:s0.getTime(), e:e0.getTime(), legacy:true}; }
  const c1 = (b.checkin||'00:00').split(':').map(Number);
  s0.setHours(c1[0]||0, c1[1]||0, 0, 0);
  const e0 = new Date(b.endDate+'T00:00:00');
  if(b.checkout){ const c2 = b.checkout.split(':').map(Number); e0.setHours(c2[0]||0, c2[1]||0, 0, 0); } else e0.setHours(24,0,0,0);
  return {s:s0.getTime(), e:e0.getTime(), legacy:false};
}
function daySegments(unitId, date){
  const ds = new Date(date+'T00:00:00'), de = new Date(ds); de.setDate(de.getDate()+1);
  const span = de.getTime()-ds.getTime(), out = [];
  BOOKINGS.forEach(b=>{
    if(b.unitId!==unitId) return;
    const iv = bkInterval(b);
    const a = Math.max(iv.s, ds.getTime()), z = Math.min(iv.e, de.getTime());
    if(z>a) out.push({b, from:(a-ds.getTime())/span, to:(z-ds.getTime())/span});
  });
  return out.sort((x,y)=>x.from-y.from);
}
function bookingsOnDay(unitId, date){ return daySegments(unitId, date).map(x=>x.b); }
function bookingOnDate(unitId, date){ const sg = daySegments(unitId, date); return sg.length ? sg[0].b : undefined; }
function durationHours(b){ const iv = bkInterval(b); return Math.round((iv.e-iv.s)/360000)/10; }
function fracToTime(f){ const mins = Math.round(f*1440); return pad(Math.floor(mins/60)%24)+':'+pad(mins%60); }
function fmtDMY(d){ return d.split('-').reverse().join('/'); }
function expensesOf(unitId){ return EXPENSES.filter(e=>e.unitId===unitId); }
function fmtMoney(n){ return (n||0).toLocaleString('en-US'); }
function grandTotal(b){ return (b.total||0) + (b.damageFee||0); }
function remainingAmt(b){ return grandTotal(b) - (b.deposit||0); }

function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function normPhone(p){ return String(p||'').replace(/\D/g,''); }
function sameTenant(b, name, phone){
  const bp = normPhone(b.phone), p = normPhone(phone);
  if(bp && p) return bp===p;
  const bn = (b.name||'').trim().toLowerCase(), n = (name||'').trim().toLowerCase();
  return !!n && bn===n;
}
function tenantBookings(name, phone, excludeId){
  return BOOKINGS.filter(b=> b.id!==excludeId && b.name && sameTenant(b,name,phone)).sort((a,b)=> b.date.localeCompare(a.date));

function avgRating(list){
  const r = list.filter(b=>b.rating>0);
  return r.length ? r.reduce((s,b)=>s+b.rating,0)/r.length : 0;
}
function tenantHistoryHtml(name, phone, excludeId){

function buildTenants(){
  const map = {};
  BOOKINGS.filter(b=>b.name).forEach(b=>{
    const p = normPhone(b.phone);
    const key = p ? 'p'+p : 'n'+b.name.trim().toLowerCase();
    (map[key] = map[key] || {key, list:[]}).list.push(b);
  });
  return Object.values(map).map(t=>{
    t.list.sort((a,b)=> b.date.localeCompare(a.date));
    t.name = t.list[0].name;
    const withPhone = t.list.find(x=>x.phone);
    t.phone = withPhone ? withPhone.phone : '';
    t.avg = avgRating(t.list);
    return t;
  }).sort((a,b)=> b.list[0].date.localeCompare(a.list[0].date));
}

function render(){

    if(settingsDrawerOpen){ settingsDrawerOpen = false; }
    const drawerSlot = document.getElementById('drawer-slot');
    if(drawerSlot) drawerSlot.innerHTML = '';
  }
  if(!authReady){
    document.getElementById('appbar-slot').innerHTML = '';
    document.getElementById('bottomnav').innerHTML = '';
    document.getElementById('screen').innerHTML = `<div class="empty-state" style="padding-top:160px;"><p>جاري التحقق من الحساب...</p></div>`;

  }
  if(!authUser){
    document.getElementById('appbar-slot').innerHTML = '';
    document.getElementById('bottomnav').innerHTML = '';
    document.getElementById('screen').innerHTML = screenAuth();

    renderModal();

  }

    document.getElementById('screen').innerHTML = screenSubscriptionLocked();

    document.getElementById('appbar-slot').innerHTML = '';
    document.getElementById('bottomnav').innerHTML = '';
    document.getElementById('screen').innerHTML = screenVerifyMail();

    document.getElementById('appbar-slot').innerHTML = '';
    document.getElementById('bottomnav').innerHTML = '';
    document.getElementById('screen').innerHTML = screenOwnerGate();
    bindOwnerGateEvents();
    return;
  }
  if(workspaceUid && memberStatus!=='active'){
    if(settingsDrawerOpen){ settingsDrawerOpen = false; const ds = document.getElementById('drawer-slot'); if(ds) ds.innerHTML=''; }
    document.getElementById('appbar-slot').innerHTML = '';

  renderAppbar();
  renderScreen();
  renderBottomnav();
  renderModal();
}

async function copyToClipboard(text, successMsg){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast(successMsg || 'تم النسخ');
  }catch(e){
    toast('تعذّر النسخ — انسخه يدويًا');
  }
}

function attachPwToggles(){
  document.querySelectorAll('input[type=password]').forEach(inp=>{
    if(inp.dataset.eye) return;
    inp.dataset.eye = '1';
    const wrap = document.createElement('div'); wrap.className = 'pw-wrap';
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pw-eye';
    btn.setAttribute('aria-label','إظهار كلمة المرور'); btn.innerHTML = icon('eye');
    btn.onclick = ()=>{
      const show = inp.type==='password';
      inp.type = show ? 'text' : 'password';
      btn.innerHTML = icon(show ? 'eyeOff' : 'eye');
      btn.classList.toggle('on', show);
      btn.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
    };
    wrap.appendChild(btn);
  });
}

function getPeriodRange(mode, anchorStr){
  const anchor = new Date((anchorStr||todayStr())+'T00:00:00');
  if(mode==='week'){
    const day = anchor.getDay();
    const diff = (day+1)%7; // days since Saturday (app week starts Saturday)
    const start = new Date(anchor); start.setDate(anchor.getDate()-diff);
    const end = new Date(start); end.setDate(start.getDate()+6);
    return {start, end};
  }
  if(mode==='month'){
    const start = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const end = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0);
    return {start, end};
  }
  return null;
}
function fmtShort(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function periodLabel(mode, anchorStr){
  const now = todayStr();
  const range = getPeriodRange(mode, anchorStr);
  if(!range) return 'كل الفترات';
  if(mode==='month') return pad(range.start.getMonth()+1)+' / '+range.start.getFullYear();
  const label = fmtShort(range.start)+' — '+fmtShort(range.end);
  const curRange = getPeriodRange('week', now);
  if(mode==='week' && range.start.getTime()===curRange.start.getTime()) return 'هذا الأسبوع (' + label + ')';
  return label;
}
function shiftRevenueAnchor(dir){
  const mode = state.revenueMode;
  const anchor = new Date((state.revenueAnchor||todayStr())+'T00:00:00');
  if(mode==='week') anchor.setDate(anchor.getDate()+7*dir);
  else if(mode==='month') anchor.setMonth(anchor.getMonth()+dir);
  state.revenueAnchor = ymd(anchor.getFullYear(), anchor.getMonth()+1, anchor.getDate());
}
function inRevenuePeriod(dateStr, mode, anchorStr){
  const range = getPeriodRange(mode, anchorStr);
  if(!range) return true;
  const d = new Date(dateStr+'T00:00:00');
  return d>=range.start && d<=range.end;
}

/* ---- per-currency grouping shared by the revenue screens ---- */
function revGroups(bks, exps){
  const merged = getCurrencyViewMode()==='merged';
  const conv = (amt, cur)=> merged ? toSYP(amt, cur||'SYP') : amt;      // merged view: everything in SYP
  const rowCur = c => merged ? 'SYP' : (c||'SYP');
  const set = new Set();
  bks.forEach(b=>set.add(rowCur(b.currency))); exps.forEach(e=>set.add(rowCur(e.currency)));
  let groups = ['SYP','USD'].filter(c=>set.has(c));
  if(!groups.length) groups = ['SYP'];
  const sums = {};
  groups.forEach(c=>{ sums[c] = {rev:0, paid:0, exp:0}; });
  bks.forEach(b=>{ const g = sums[rowCur(b.currency)]; g.rev += conv(grandTotal(b), b.currency); g.paid += conv(b.deposit||0, b.currency); });
  exps.forEach(e=>{ const g = sums[rowCur(e.currency)]; g.exp += conv(e.amount||0, e.currency); });
  groups.forEach(c=>{ const g = sums[c]; g.remain = g.rev-g.paid; g.net = g.rev-g.exp; g.paidNet = g.paid-g.exp; });
  return {merged, groups, sums, conv, rowCur};
}
const CUR_TITLES = {SYP:'ليرة سورية', USD:'دولار'};
const CUR_SHORT = {SYP:'ل.س', USD:'$'};
function currencyStrips(groups, sums, merged){
  return groups.map(c=>{
    const g = sums[c];
    return `
  <div class="section-title" style="margin-top:${c===groups[0]?'0':'14px'}">${merged ? 'ليرة سورية (مدمج)' : CUR_TITLES[c]}</div>
  <div class="revenue-strip">
    <div class="stat-card green"><div class="lbl">إيرادات ${CUR_SHORT[c]}</div><div class="val">${fmtMoney(g.rev)}</div></div>
    <div class="stat-card red"><div class="lbl">مصاريف ${CUR_SHORT[c]}</div><div class="val">${fmtMoney(g.exp)}</div></div>
    <div class="stat-card gold"><div class="lbl">الصافي ${CUR_SHORT[c]}</div><div class="val">${fmtMoney(g.net)}</div></div>
  </div>`;
  }).join('');
}

function screenRevenue(){

  const {merged, groups, sums, conv, rowCur} = revGroups(bks, exps);

  // merge bookings + expenses into one chronological list
  let txns = [];
  bks.forEach(b=> txns.push({type:'income', date:b.date, sortKey:b.date+'a', id:b.id, booking:b}));
  exps.forEach(e=> txns.push({type:'expense', date:e.date, sortKey:e.date+'b', id:e.id, expense:e}));
  txns.sort((a,b)=> a.sortKey.localeCompare(b.sortKey));

        : `<div><span class="pill settled" style="font-size:9px;">مُسوّى</span></div><span data-unsettle="${b.id}" style="color:var(--cream-dim); font-weight:800; font-size:11px; cursor:pointer; white-space:nowrap;">تراجع</span>`)

    } else {
      const e = t.expense, rc = rowCur(e.currency), amt = conv(e.amount||0, e.currency);
      const cells = groups.map(c=> c!==rc ? blank(c) :
        `<td style="${GB} color:#ec8179; font-weight:800;">−${fmtMoney(amt)}</td><td style="color:#ec8179; font-weight:800;">−${fmtMoney(amt)}</td><td></td>`).join('');
      return `<tr>
        <td>${dateWithDay(e.date)}</td>
        <td>${escHtml(e.desc)}</td>
        ${cells}
        <td>${canEditUnitsExpenses() ? `
          <div style="display:flex; gap:4px;">
            <div class="mini-icon-btn" data-edit-expense="${e.id}" title="تعديل">${icon('edit')}</div>
            ${canDeleteUnitsExpenses() ? `<div class="mini-icon-btn danger" data-del-expense="${e.id}" title="حذف">${icon('trash')}</div>` : ''}
          </div>` : ''}</td>

  const head1 = groups.map(c=>`<th colspan="3" style="text-align:center; ${GB}">${merged ? 'ليرة سورية (مدمج)' : CUR_TITLES[c]}</th>`).join('');
  const head2 = groups.map(c=>`<th style="${GB}">الإجمالي</th><th>مدفوع</th><th>متبقي</th>`).join('');
  const totalRow = groups.map(c=>`<td style="${GB} font-weight:800; color:var(--green)">${fmtMoney(sums[c].rev)}</td><td style="font-weight:800; color:var(--cream)">${fmtMoney(sums[c].paidNet)}</td><td style="font-weight:800; color:#ec8179">${fmtMoney(sums[c].remain)}</td>`).join('');
  const netRow = groups.map(c=>`<td colspan="3" style="${GB} text-align:center; font-weight:800; color:${sums[c].net>=0?'var(--green)':'#ec8179'}">${fmtMoney(sums[c].net)} ${CUR_SHORT[c]}</td>`).join('');

  return `
  <div class="section-title" style="margin-top:10px">ملخص الوحدة</div>
  <div class="filter-chips" style="margin-bottom:10px;">
    ${[['all','الكل'],['week','أسبوعي'],['month','شهري']].map(([k,l])=>`
      <div class="chip ${mode===k?'active':''}" data-mode="${k}">${l}</div>`).join('')}
  </div>
  ${mode!=='all' ? `

  ${txns.length? `<div style="overflow-x:auto;"><table class="table" style="min-width:${190 + groups.length*215}px;">
    <tr><th rowspan="2">التاريخ</th><th rowspan="2">البيان</th>${head1}<th rowspan="2"></th></tr>
    <tr>${head2}</tr>

  ${isOwnerMode ? `<button class="big-btn ghost" id="addExpenseBtn">${icon('plus')} إضافة مصروف</button>` : ''}
  `;
}

function screenGeneralRevenue(){
  const allB = BOOKINGS.filter(b=>unitById(b.unitId)), allE = EXPENSES.filter(e=>unitById(e.unitId));
  const {merged, groups, sums, conv, rowCur} = revGroups(allB, allE);
  const netFor = (bks, exps, c)=>
    bks.filter(b=>rowCur(b.currency)===c).reduce((t,b)=>t+conv(grandTotal(b),b.currency),0)
    - exps.filter(e=>rowCur(e.currency)===c).reduce((t,e)=>t+conv(e.amount||0,e.currency),0);

  const perUnit = UNITS.map(u=>({u, bks:bookingsOf(u.id), exps:expensesOf(u.id)}));

    const units = perUnit.filter(x=>x.u.cat===c.id);

    ${perUnit.map(x=>`<tr><td>${escHtml(x.u.name)}</td>${parts(x.bks, x.exps, (c,r,e)=>`<td style="${GB}">${fmtMoney(r)}</td><td>${fmtMoney(e)}</td><td style="font-weight:800; color:${r-e>=0?'var(--green)':'#ec8179'}">${fmtMoney(r-e)}</td>`).join('')}</tr>`).join('')}

function subClockInner(){
  if(!subscriptionExpiresAt) return '';
  const DAY = 864e5, ms = subscriptionExpiresAt - Date.now(), left = Math.max(0, ms);
  const totalDays = Math.floor(left/DAY), mo = Math.floor(totalDays/30), d = totalDays%30;
  const h = Math.floor((left%DAY)/36e5), mi = Math.floor((left%36e5)/6e4);
  const two = n=>String(n).padStart(2,'0');
  const tile = (v,l)=>`<div class="sc-tile"><b>${two(v)}</b><span>${l}</span></div>`;
  const red = ms <= 2*DAY;
  return `<div class="sclock ${red?'red':''}">${tile(mo,'شهر')}<div class="sc-sep">:</div>${tile(d,'يوم')}<div class="sc-sep">:</div>${tile(h,'ساعة')}<div class="sc-sep">:</div>${tile(mi,'دقيقة')}</div>`
    + `<div class="sc-until">${ms>0 ? '<span>ينتهي الاشتراك في</span>' : '<span>انتهى الاشتراك في</span>'} <b dir="ltr">${fmtDMY(new Date(subscriptionExpiresAt).toISOString().slice(0,10))}</b></div>`;
}
function subClockHtml(){ return subscriptionExpiresAt ? `<div class="sclock-wrap">${subClockInner()}</div>` : ''; }
setInterval(()=>{ document.querySelectorAll('.sclock-wrap').forEach(el=>{ el.innerHTML = subClockInner(); if(window.trDom) try{ window.trDom(el); }catch(e){} }); }, 20000);

/* ============================= EVENTS PER SCREEN ============================= */
function bindUnitListEvents(){
  document.querySelectorAll('[data-unit]').forEach(el=> el.onclick=()=>go('unit',{unitId:el.dataset.unit}));
  document.querySelectorAll('[data-edit-unit]').forEach(el=> el.onclick=(ev)=>{ ev.stopPropagation(); if(!canEditUnitsExpenses()) return; openUnitForm({editId:el.dataset.editUnit}); });
  document.querySelectorAll('[data-del-unit]').forEach(el=> el.onclick=(ev)=>{ ev.stopPropagation(); if(!canDeleteUnitsExpenses()){ toast('الحذف للمدير فقط'); return; } confirmDeleteUnit(el.dataset.delUnit); });
}

function bindScreenEvents(){
  document.querySelectorAll('[data-cat]').forEach(el=> el.onclick=()=>go('category',{catId:el.dataset.cat}));
  document.querySelectorAll('[data-nav]').forEach(el=> el.onclick=()=>go(el.dataset.nav));
  bindUnitListEvents();

  const addUnitBtn = document.getElementById('addUnitBtn');
  if(addUnitBtn) addUnitBtn.onclick = ()=> openUnitForm({catId: state.catId});

  const unitSearch = document.getElementById('unitSearch');
  if(unitSearch){
    unitSearch.oninput = ()=>{
      const q = unitSearch.value.trim();
      const list = unitsOf(state.catId).filter(u=>u.name.includes(q) || u.loc.includes(q));
      document.getElementById('unitList').innerHTML = renderUnitList(list);
      bindUnitListEvents();
    };
  }

  const prevM = document.getElementById('prevMonth'), nextM = document.getElementById('nextMonth');
  if(prevM) prevM.onclick = ()=>{ let m=state.calMonth-1, y=state.calYear; if(m<1){m=12;y--;} go('unit',{calMonth:m, calYear:y}); };
  if(nextM) nextM.onclick = ()=>{ let m=state.calMonth+1, y=state.calYear; if(m>12){m=1;y++;} go('unit',{calMonth:m, calYear:y}); };

  document.querySelectorAll('.day[data-date]').forEach(el=>{
    el.onclick = ()=>{
      const date = el.dataset.date;
      const list = bookingsOnDay(state.unitId, date);
      if(list.length) openModal({type:'dayDetail', bookingId:list[0].id, day:date});
      else if(canCreateBooking()) openBookingForm({unitId:state.unitId, date});
      else toast('ليس لديك صلاحية إضافة حجوزات');
    };
  });

  const goRevenue = document.getElementById('goRevenue');
  if(goRevenue) goRevenue.onclick = ()=> go('revenue', {unitId:state.unitId});

  const addExpenseBtn = document.getElementById('addExpenseBtn');
  if(addExpenseBtn) addExpenseBtn.onclick = ()=> openExpenseForm(state.unitId);

  document.querySelectorAll('[data-mode]').forEach(el=>{
    el.onclick = ()=>{
      state.revenueMode = el.dataset.mode;
      state.revenueAnchor = todayStr();
      renderScreen();
    };
  });
  const prevPeriod = document.getElementById('prevPeriod');
  if(prevPeriod) prevPeriod.onclick = ()=>{ shiftRevenueAnchor(-1); renderScreen(); };
  const nextPeriod = document.getElementById('nextPeriod');
  if(nextPeriod) nextPeriod.onclick = ()=>{ shiftRevenueAnchor(1); renderScreen(); };
  document.querySelectorAll('[data-open-booking]').forEach(el=>{
    el.onclick = (ev)=>{
      if(ev.target.closest('[data-settle],[data-unsettle]')) return;
      const b = BOOKINGS.find(x=>x.id===el.dataset.openBooking);
      if(b) openDayDetail(b);
    };
  });
  document.querySelectorAll('[data-edit-expense]').forEach(el=>{
    el.onclick = ()=>{ if(!canEditUnitsExpenses()) return; openExpenseForm(state.unitId, el.dataset.editExpense); };
  });
  document.querySelectorAll('[data-del-expense]').forEach(el=>{
    el.onclick = ()=>{ if(!canDeleteUnitsExpenses()){ toast('الحذف للمدير فقط'); return; } deleteExpense(el.dataset.delExpense); };
  });

  document.querySelectorAll('[data-settle]').forEach(el=>{
    el.onclick = ()=>{ settleBooking(el.dataset.settle); };
  });
  document.querySelectorAll('[data-unsettle]').forEach(el=>{
    el.onclick = ()=>{ unsettleBooking(el.dataset.unsettle); };
  });

  const tenantSearch = document.getElementById('tenantSearch');
  if(tenantSearch){
    tenantSearch.oninput = ()=>{
      state.tenantQ = tenantSearch.value;
      const box = document.getElementById('tenantList');
      if(box){ box.innerHTML = tenantListHtml(state.tenantQ); bindTenantRows(); }
    };
  }
  bindTenantRows();
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.oninput = ()=>{
      state.searchQ = searchInput.value;
      const box = document.getElementById('searchResults');
      if(box){ box.innerHTML = searchResultsHtml(); bindSearchResultEvents(); }
    };
  }
  document.querySelectorAll('[data-filter]').forEach(el=> el.onclick=()=>{ state.searchFilter=el.dataset.filter; renderScreen(); });
  bindSearchResultEvents();

  const notifMaster = document.getElementById('notifMaster');
  if(notifMaster) notifMaster.onclick = ()=>{
    NOTIF.enabled=!NOTIF.enabled;
    if(NOTIF.enabled && 'Notification' in window && Notification.permission==='default'){
      Notification.requestPermission();
    }
    scheduleCloudSync();
    refreshSettingsOrScreen();
  };
  const testNotifBtn = document.getElementById('testNotifBtn');
  if(testNotifBtn) testNotifBtn.onclick = async ()=>{
    if(isNativeApp()){
      let perm = await getNativeNotifPermission();
      if(perm==='prompt' || perm==='prompt-with-rationale'){
        perm = await requestNativeNotifPermission();
      }
      nativeNotifPermCache = perm;
      if(perm!=='granted'){
        toast('يجب منح إذن الإشعارات من الهاتف لكي تعمل');
        refreshSettingsOrScreen();
        return;
      }
      scheduleNativeReminders(true);
      nativeExactAlarmCheck();
      const ok = await showAppNotification('تجربة تنبيه EjarRent', {body:'إذا وصلك هذا الإشعار وسمعت الصوت، فالإشعارات تعمل بشكل سليم ✔'});
      if(!ok) toast('حدث خطأ أثناء عرض الإشعار');
      refreshSettingsOrScreen();
      return;
    }
    if(!('Notification' in window)){ toast('المتصفح لا يدعم الإشعارات — جرّب من داخل التطبيق المثبّت'); return; }
    if(Notification.permission==='default'){
      const res = await Notification.requestPermission();
      if(res!=='granted'){ toast('يجب منح إذن الإشعارات من الهاتف لكي تعمل'); refreshSettingsOrScreen(); return; }
    }
    if(Notification.permission==='denied'){
      toast('الإذن مرفوض — افتح إعدادات الهاتف ← التطبيقات ← EjarRent ← الإشعارات وفعّله يدويًا');
      return;
    }
    playBeep();
    const ok = await showAppNotification('تجربة تنبيه EjarRent', {body:'إذا رأيت هذا وسمعت الصوت، فالإشعارات تعمل بشكل سليم ✔', icon:'icon-192.png'});
    if(!ok) toast('حدث خطأ أثناء عرض الإشعار — جرّب إغلاق التطبيق وفتحه من جديد');
    refreshSettingsOrScreen();
  };
  document.querySelectorAll('[data-notif-tone]').forEach(el=>{
    el.onclick = ()=>{ setNotifTonePref(el.dataset.notifTone); scheduleNativeReminders(true); refreshSettingsOrScreen(); };
  });
  document.querySelectorAll('[data-dp-global]').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.dpGlobal;
      openDurPicker({title: k==='beforeCheckin' ? 'التنبيه قبل الاستلام' : 'التنبيه قبل التسليم', val: NOTIF[k]||60, apply:{kind:'g', key:k}, back:null});
    };
  });
  document.querySelectorAll('[data-rem-toggle]').forEach(el=>{
    el.onclick = (ev)=>{
      ev.stopPropagation();
      if(!canEditBooking()){ toast('ليس لديك صلاحية تعديل الحجز'); return; }
      const b = BOOKINGS.find(x=>x.id===el.dataset.remToggle); if(!b) return;
      const on = !remCfg(b).on;
      b.rem = Object.assign({}, b.rem||{}, {on});
      if(on) delete b.rem.on;
      if(!Object.keys(b.rem).length) delete b.rem;
      saveState(); renderScreen();
    };
  });
  document.querySelectorAll('[data-rem-edit]').forEach(el=>{
    el.onclick = ()=>{
      if(!canEditBooking()){ toast('ليس لديك صلاحية تعديل الحجز'); return; }
      const b = BOOKINGS.find(x=>x.id===el.dataset.remEdit); if(!b) return;
      openModal({type:'remSettings', bookingId:b.id, draft:Object.assign({}, remCfg(b))});
    };
  });
  document.querySelectorAll('[data-copy-mail]').forEach(el=>{ el.onclick = ()=> copyToClipboard(CONTACT_EMAIL, 'تم نسخ البريد'); });
  const remGen = document.querySelector('[data-rem-gen]');
  if(remGen) remGen.onclick = ()=>{ state.remGenOpen = !state.remGenOpen; renderScreen(); };

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = exportBackup;

  const words = String(text).split(/\s+/), lines = []; let cur = '';

  if(cur) lines.push(cur);

}

function dataUrlToBytes(url){

}
async function buildBookingPdf(b, canvas){

function jpegToPdfBytes(jpg, w, h){
  const enc = new TextEncoder(), parts = []; let len = 0; const offs = [];
  const push = (d)=>{ const u8 = (typeof d==='string') ? enc.encode(d) : d; parts.push(u8); len += u8.length; };
  const obj = (n, body)=>{ offs[n] = len; push(n+' 0 obj\n'+body+'\nendobj\n'); };
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4] = len;
  push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');
  push(jpg); push('\nendstream\nendobj\n');
  const content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(5,'<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
  const xref = len; let t = 'xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++) t += String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(t+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  const out = new Uint8Array(len); let o = 0; parts.forEach(p=>{ out.set(p, o); o += p.length; });
  return out;
}
function bytesToBase64(u8){
  let s = ''; const CH = 0x8000;
  for(let i=0;i<u8.length;i+=CH) s += String.fromCharCode.apply(null, u8.subarray(i, i+CH));
  return btoa(s);
}
async function deliverFile(bytes, filename, mime, title){

    const uri = await FS.getUri({path: filename, directory: 'CACHE'});
    try{ await SH.share({title, url: uri.uri, dialogTitle: title}); }

const PHOTO_MAX_PER_BOOKING = 10;
const PHOTO_NAME_SUGGESTIONS = ['صورة هوية','صورة العقد','صورة الرخصة','صورة السيارة','صورة الأضرار','إيصال دفع'];
let _photoDbP = null;
function photoDb(){
  if(_photoDbP) return _photoDbP;
  _photoDbP = new Promise((res, rej)=>{
    const r = indexedDB.open('ejar_photos_v1', 1);
    r.onupgradeneeded = ()=>{ const db = r.result; db.createObjectStore('photos', {keyPath:'id'}).createIndex('bookingId','bookingId'); db.createObjectStore('blobs', {keyPath:'id'}); };
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=>{ _photoDbP = null; rej(r.error); };
  });
  return _photoDbP;
}
function idbReq(rq){ return new Promise((res, rej)=>{ rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>rej(rq.error); }); }
function idbTx(tx){ return new Promise((res, rej)=>{ tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error); tx.onabort = ()=>rej(tx.error); }); }
async function photosOfBooking(bid){
  const db = await photoDb();
  const all = await idbReq(db.transaction('photos').objectStore('photos').index('bookingId').getAll(bid));
  return all.sort((a,b)=>a.createdAt-b.createdAt);
}
async function photosAllMeta(){ const db = await photoDb(); return idbReq(db.transaction('photos').objectStore('photos').getAll()); }
async function photoMeta(id){ const db = await photoDb(); return idbReq(db.transaction('photos').objectStore('photos').get(id)); }
async function photoBlob(id){ const db = await photoDb(); const r = await idbReq(db.transaction('blobs').objectStore('blobs').get(id)); return r ? r.blob : null; }
async function photoPut(meta, blob){
  const db = await photoDb(); const tx = db.transaction(['photos','blobs'], 'readwrite');
  tx.objectStore('photos').put(meta); tx.objectStore('blobs').put({id:meta.id, blob});
  return idbTx(tx);
}
async function photoRename(id, name){
  const db = await photoDb(); const tx = db.transaction('photos','readwrite'); const st = tx.objectStore('photos');
  const m = await idbReq(st.get(id)); if(m){ m.name = name; st.put(m); }
  return idbTx(tx);
}
async function photoDeleteById(id){
  const db = await photoDb(); const tx = db.transaction(['photos','blobs'],'readwrite');
  tx.objectStore('photos').delete(id); tx.objectStore('blobs').delete(id); return idbTx(tx);
}
async function photoDeleteForBooking(bid){ const l = await photosOfBooking(bid); for(const m of l) await photoDeleteById(m.id); }

async function loadBitmap(file){
  try{ return await createImageBitmap(file, {imageOrientation:'from-image'}); }catch(e){}
  return new Promise((res, rej)=>{ const u = URL.createObjectURL(file); const im = new Image(); im.onload = ()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error('image')); }; im.src = u; });
}
function drawScaled(src, maxSide){
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, k = Math.min(1, maxSide/Math.max(w,h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w*k)); c.height = Math.max(1, Math.round(h*k));
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(src, 0, 0, c.width, c.height); return c;
}
const canvasBlob = (c, q)=> new Promise(res=> c.toBlob(res, 'image/jpeg', q));
async function compressPhoto(file){

}
async function makeThumb(blob){ const bm = await loadBitmap(blob); const t = drawScaled(bm, 240).toDataURL('image/jpeg', 0.6); if(bm.close) bm.close(); return t; }
